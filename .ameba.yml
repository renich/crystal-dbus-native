Globs:
  - src/**/*.cr
  - spec/**/*.cr

Excluded:
  - lib
  - bin
  - docs/build
  - docs/technical/api

Layout/LineLength:
  Enabled: true
  MaxLength: 120

Style/GuardClause:
  Enabled: true

Metrics/CyclomaticComplexity:
  Enabled: true
  MaxComplexity: 10

Documentation/Documentation:
  Enabled: true
